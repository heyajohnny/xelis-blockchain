[package]
name = "xelis_security_tests"
version = "1.25.0"
edition = "2021"
authors = ["Security Review Team"]

[dependencies]
xelis_common = { path = "../xelis_common" }
xelis_daemon = { path = "../xelis_daemon" }

# Test dependencies
tokio = { version = "1", features = ["full"] }
